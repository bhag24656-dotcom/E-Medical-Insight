<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 32px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .output {
      margin-top: 24px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.875rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Project Web Interface</h1>
    <p>Interact with the API endpoints directly from this dashboard.</p>

    <form id="dataForm">
      <div class="form-group">
        <label for="endpoint">API Endpoint</label>
        <input type="text" id="endpoint" value="http://localhost:8080/api" required />
      </div>
      <button type="submit">Send Request</button>
    </form>

    <div id="result" class="output">Ready to execute requests...</div>
  </div>

  <script>
    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = document.getElementById('endpoint').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.textContent = 'Sending request...';

      try {
        const response = await fetch(endpoint);
        const data = await response.json();
        resultDiv.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultDiv.textContent = `Error connecting to API:\n${err.message}`;
      }
    });
  </script>

</body>
</html>
